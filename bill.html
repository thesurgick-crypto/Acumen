<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill</title>
<style>
  body{background:#fff;color:#000;font-family:"Courier New",monospace;margin:0;padding:12px}
  .rc{width:58mm;max-width:100%;margin:0 auto;font-size:12px;line-height:1.35}
  .c{text-align:center}.b{font-weight:bold}
  .shop{font-size:18px;font-weight:bold;letter-spacing:2px}
  hr{border:0;border-top:1px dashed #000;margin:6px 0}
  .r{display:flex;justify-content:space-between;gap:6px}
  .it{margin:3px 0}
  .tools{max-width:58mm;margin:14px auto 0;display:flex;gap:8px}
  .tools button,.tools a{flex:1;padding:12px;font-size:15px;border:1px solid #000;background:#000;color:#fff;border-radius:6px;text-align:center;text-decoration:none;font-family:Arial,sans-serif}
  .tools a{background:#fff;color:#000}
  @page{size:58mm auto;margin:0}
  @media print{body{padding:0}.rc{width:100%;padding:2mm}.tools{display:none}}
</style>
</head>
<body>
<div class="rc" id="rc">Loading...</div>
<div class="tools"><a href="sales.html">Back</a><button id="print">Print</button></div>
<script type="module">
import { db } from "./js/firebase-config.js";
import { requireAuth } from "./js/auth.js";
import { SHOP, esc, taka, fmtDate } from "./js/util.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const id = new URLSearchParams(location.search).get("id");
document.getElementById("print").addEventListener("click", () => window.print());

requireAuth(async () => {
  const rc = document.getElementById("rc");
  try {
    const snap = await getDoc(doc(db, "sales", id));
    if (!snap.exists()) { rc.textContent = "Bill pawa jay nai."; return; }
    const s = snap.data();
    rc.innerHTML = `
      <div class="c shop">${esc(SHOP.name)}</div>
      <div class="c">${esc(SHOP.address)}</div>
      ${SHOP.phone ? `<div class="c">${esc(SHOP.phone)}</div>` : ""}
      <hr>
      <div class="r"><span>Bill: ${esc(s.invoiceNo)}</span><span>${esc(s.method)}</span></div>
      <div>${fmtDate(s.createdAt)}</div>
      <div>Customer: ${esc(s.customerName || "Walk-in")}</div>
      ${s.customerPhone ? `<div>Phone: ${esc(s.customerPhone)}</div>` : ""}
      ${s.customerAddress ? `<div>Address: ${esc(s.customerAddress)}</div>` : ""}
      <hr>
      ${s.items.map(i => `<div class="it"><div>${esc(i.name)}</div>
        <div class="r"><span>${i.qty} x ${taka(i.price)}</span><span>${taka(i.qty * i.price)}</span></div></div>`).join("")}
      <hr>
      <div class="r"><span>Subtotal</span><span>${taka(s.subtotal)}</span></div>
      ${s.discount ? `<div class="r"><span>Discount</span><span>- ${taka(s.discount)}</span></div>` : ""}
      ${s.delivery ? `<div class="r"><span>Delivery</span><span>${taka(s.delivery)}</span></div>` : ""}
      <div class="r b" style="font-size:14px"><span>TOTAL</span><span>${taka(s.total)}</span></div>
      <div class="r"><span>Paid</span><span>${taka(s.paid)}</span></div>
      <div class="r b"><span>Due</span><span>${taka(s.due || s.returnedDue || 0)}</span></div>
      <hr>
      <div class="c">Thank you for shopping!</div>
      <div class="c">Collect. Explore. Upgrade.</div>`;
  } catch { rc.textContent = "Bill load hoy nai."; }
});
</script>
</body>
</html>
