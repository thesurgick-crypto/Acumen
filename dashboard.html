<!DOCTYPE html>
<html lang="bn">

<script type="module">
import { requireAuth, logout } from "./js/auth.js";
requireAuth((user, profile) => {
  document.getElementById("hello").textContent = "Hi " + (profile.name || user.email) + " (" + profile.role + ")";
});
document.getElementById("out").addEventListener("click", logout);
</script>
