<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SURGICK - Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="top"><div class="logo">SUR<b>G</b>ICK</div><button id="out">Logout</button></div>
<main>
  <div class="hello" id="hello">Loading...</div>
  <h2>Dashboard</h2>
  <div class="grid">
    <div class="stat"><span>Ajker bikri</span><p id="todaySales">৳ 0</p></div>
    <div class="stat"><span>Ajker profit</span><p style="color:var(--ok)" id="todayProfit">৳ 0</p></div>
    <div class="stat"><span>Mot baki</span><p style="color:var(--bad)" id="due">৳ 0</p></div>
    <div class="stat"><span>Low stock</span><p style="color:var(--orange)" id="lowCount">0</p></div>
    <div class="stat"><span>Total product</span><p id="prodCount">0</p></div>
    <div class="stat"><span>Stock er dam (kena)</span><p id="stockValue">৳ 0</p></div>
  </div>
</main>
<nav class="nav" id="nav"></nav>
<script type="module">
import { db } from "./js/firebase-config.js";
import { requireAuth, logout } from "./js/auth.js";
import { taka, renderNav } from "./js/util.js";
import { collection, onSnapshot, query, where, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

renderNav("home");
const $ = (id) => document.getElementById(id);

requireAuth((user, profile) => {
  $("hello").textContent = "Hi " + (profile.name || user.email) + " (" + profile.role + ")";

  onSnapshot(collection(db, "products"), (snap) => {
    const list = snap.docs.map(d => d.data());
    $("prodCount").textContent = list.length;
    $("lowCount").textContent = list.filter(p => p.stock <= (p.lowAlert ?? 3)).length;
    $("stockValue").textContent = taka(list.reduce((s, p) => s + (p.stock || 0) * (p.buyPrice || 0), 0));
  });

  onSnapshot(collection(db, "customers"), (snap) => {
    $("due").textContent = taka(snap.docs.reduce((s, d) => s + (d.data().due || 0), 0));
  });

  const start = new Date(); start.setHours(0, 0, 0, 0);
  onSnapshot(query(collection(db, "sales"), where("createdAt", ">=", Timestamp.fromDate(start))), (snap) => {
    let sales = 0, profit = 0;
    snap.docs.map(d => d.data()).filter(s => s.status !== "Returned").forEach(s => {
      sales += s.total;
      profit += s.subtotal - s.discount - s.items.reduce((a, i) => a + i.qty * i.cost, 0);
    });
    $("todaySales").textContent = taka(sales);
    $("todayProfit").textContent = taka(profit);
  });
});
$("out").addEventListener("click", logout);
</script>
</body>
</html>
